plugins { id 'com.android.application' }

android {
    namespace 'io.github.op7418.guizangtv'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.op7418.guizangtv'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '0.4.0-dev'
    }
    signingConfigs {
        release {
            if (System.getenv('GUIZANG_KEYSTORE')) {
                storeFile file(System.getenv('GUIZANG_KEYSTORE'))
                storePassword System.getenv('GUIZANG_STORE_PASSWORD')
                keyAlias System.getenv('GUIZANG_KEY_ALIAS') ?: 'guizang-tv'
                keyPassword System.getenv('GUIZANG_KEY_PASSWORD') ?: System.getenv('GUIZANG_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('GUIZANG_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
